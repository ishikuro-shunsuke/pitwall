<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>pitwall</title>
  <link rel="stylesheet" href="/styles.css" />
  <script>
    try {
      const t = localStorage.getItem('pitwall.theme');
      if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
    } catch { /* ignore */ }
  </script>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 16 12" aria-hidden="true">
        <path d="M0 0h4v4H0zM8 0h4v4H8zM4 4h4v4H4zM12 4h4v4h-4zM0 8h4v4H0zM8 8h4v4H8z" />
      </svg>
      <h1>pitwall</h1>
      <span id="conn" class="conn" role="status" hidden>offline</span>
    </div>
    <div class="actions">
      <button type="button" class="icon-btn theme-toggle" id="theme-toggle"></button>
      <button type="button" class="icon-btn" id="history" aria-pressed="false"
              title="past entries" aria-label="past entries">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" />
          <path d="M3 3v5h5" /><path d="M12 7v5l4 2" />
        </svg>
      </button>
    </div>
  </header>

  <main>
    <div id="timeline" class="timeline"></div>
    <button type="button" id="more" class="more hidden"></button>
    <p id="empty" class="empty hidden">No entries.</p>
  </main>

  <div id="lightbox" class="lightbox hidden" role="dialog" aria-modal="true">
    <button type="button" class="lightbox-close" id="lightbox-close">×</button>
    <div id="lightbox-stage" class="lightbox-stage">
      <img id="lightbox-img" alt="" />
    </div>
    <div class="lightbox-bar">
      <p id="lightbox-cap" class="lightbox-cap"></p>
      <a id="lightbox-raw" class="lightbox-raw" target="_blank" rel="noopener noreferrer">open original</a>
    </div>
  </div>

  <script src="/app.js" type="module"></script>
</body>
</html>
