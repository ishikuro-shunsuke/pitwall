<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>pitwall</title>
  <link rel="stylesheet" href="/styles.css" />
  <script>
    try {
      const t = localStorage.getItem('pitwall.theme');
      if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
    } catch { /* ignore */ }
  </script>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark"></span>
      <h1>pitwall</h1>
      <span id="conn" class="conn" role="status" hidden>offline</span>
    </div>
    <div class="filters">
      <div class="filter" id="filter-answer" hidden>
        <span>show</span>
        <div class="filter-group">
          <button type="button" class="filter-chip" id="filter-unanswered" aria-pressed="false">unanswered only</button>
        </div>
      </div>
      <div class="filter">
        <button type="button" class="filter-chip theme-toggle" id="theme-toggle"></button>
      </div>
      <div class="filter">
        <button type="button" class="filter-chip history-chip" id="history" aria-pressed="false"
                title="past entries"><span class="history-x" aria-hidden="true">×</span><span
          class="history-glyph" aria-label="past entries">🕘</span><span
          class="history-count" id="history-count" title="mark these read" hidden></span></button>
      </div>
    </div>
  </header>

  <main>
    <div class="rail" aria-hidden="true"></div>
    <div id="timeline" class="timeline"></div>
    <button type="button" id="more" class="more hidden"></button>
    <p id="empty" class="empty hidden">No entries.</p>
  </main>

  <div id="lightbox" class="lightbox hidden" role="dialog" aria-modal="true">
    <button type="button" class="lightbox-close" id="lightbox-close">×</button>
    <div id="lightbox-stage" class="lightbox-stage">
      <img id="lightbox-img" alt="" />
    </div>
    <div class="lightbox-bar">
      <p id="lightbox-cap" class="lightbox-cap"></p>
      <a id="lightbox-raw" class="lightbox-raw" target="_blank" rel="noopener noreferrer">open original</a>
    </div>
  </div>

  <script src="/app.js" type="module"></script>
</body>
</html>
